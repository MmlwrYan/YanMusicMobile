distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# ⚠️ 本机（DESKTOP-OPH553O）经代理访问 services.gradle.org 时**下载会被截断**
#    （实测 5 分钟仅得 30 MB，zip 损坏；该 URL 返回 307 重定向，问题在重定向后的目标）。
#    CI（GitHub ubuntu runner）直连正常，故此处保持官方 URL。
#
#    本机若遇 `./gradlew` 卡在下载 / 解包报错，改用腾讯云镜像（实测 206 支持分段，
#    57 秒拿到完整 136,920,070 B）：
#      1) 临时把本行换成：
#         distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip
#      2) 或手工下载后放入
#         ~/.gradle/wrapper/dists/gradle-8.11.1-bin/bpt9gzteqjrbo1mjrsomdt32c/
#         并 touch gradle-8.11.1-bin.zip.ok
#    注意：该目录名是 **分发包 URL 的 Base36 哈希**，不是 SHA-256；
#          distributionSha256Sum 只做校验、不决定路径。
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
# 校验和来自 https://services.gradle.org/distributions/gradle-8.11.1-bin.zip.sha256
# 本机网络经代理，曾出现下载被截断（30 MB）却"成功"的情况 —— 有此校验会直接失败而非解包出错。
# 若上游重发导致不匹配，请重新拉取官方 .sha256 并同步此值。
distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
networkTimeout=30000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
